name: minha-paroquia
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup first}
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./db:/app/db:ro
      - ./src/lib:/app/src/lib:ro
      - ./public/data:/app/public/data:ro
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure administrator email}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure administrator password}
    depends_on:
      db:
        condition: service_healthy
    command: [node, scripts/migrate.mjs]
  web:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3100}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
  checks:
    profiles: [tools]
    build:
      context: .
      target: build
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'npm run lint && npm run typecheck && npm test && npm audit --audit-level=high']
  catalog:
    profiles: [tools]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./db/catalog:/app/db/catalog
      - ./public/data:/app/public/data:ro
    command: [node, scripts/fetch-parish-catalog.mjs]
  geography:
    profiles: [tools]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./public/data:/app/public/data
    command: [node, scripts/build-municipality-seats.mjs]
  catalog-national:
    profiles: [tools]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./db/catalog:/app/db/catalog
      - ./public/data:/app/public/data:ro
      - ./.cache:/app/.cache
    command: [node, scripts/fetch-cnbb-inventory.mjs]
  catalog-regional:
    profiles: [tools]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./db/catalog:/app/db/catalog
      - ./public/data:/app/public/data:ro
    command: [node, scripts/fetch-diocesan-directories.mjs]
  catalog-expansion:
    profiles: [tools]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./db/catalog:/app/db/catalog
      - ./public/data:/app/public/data:ro
      - ./.cache:/app/.cache
    command: [node, scripts/fetch-diocesan-expansion.mjs]
  catalog-reference:
    profiles: [tools]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./db/reference:/app/db/reference
      - ./public/data:/app/public/data:ro
      - ./.cache:/app/.cache
    command: [node, scripts/fetch-reference-directory.mjs]
  highways:
    profiles: [tools]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./public/data:/app/public/data
      - ./.cache:/app/.cache
    command: [node, scripts/fetch-ibge-roads.mjs]
volumes:
  postgres_data:
